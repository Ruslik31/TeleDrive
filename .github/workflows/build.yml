name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  pull_request:
    paths-ignore:
      - "**.md"
      - "**.yml"
      - LICENSE
      - .github/screenshots/**
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Setup keystore
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias ruslik31 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass teledrive -keypass teledrive \
              -dname "CN=Ruslik31, OU=TeleDrive, O=TeleDrive, L=City, ST=State, C=US"
            echo "KEYSTORE_PASSWORD=teledrive" >> $GITHUB_ENV
            echo "KEY_ALIAS=ruslik31" >> $GITHUB_ENV
            echo "KEY_PASSWORD=teledrive" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Assemble debug APKs
        run: ./gradlew :android:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-arm64-v8a
          path: android/build/outputs/apk/debug/*-arm64-v8a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-armeabi-v7a
          path: android/build/outputs/apk/debug/*-armeabi-v7a-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-x86_64
          path: android/build/outputs/apk/debug/*-x86_64-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-x86
          path: android/build/outputs/apk/debug/*-x86-debug.apk
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-universal
          path: android/build/outputs/apk/debug/*-universal-debug.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Desktop tests
        run: ./gradlew :desktop:test

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: TeleDrive-windows
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error
