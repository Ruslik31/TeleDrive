name: Build and publish release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Generate keystore and build signed release APKs
        run: |
          # generate a temporary keystore (stored only during the workflow run)
          keytool -genkeypair -v -keystore release.keystore -alias teledrive -storepass password -keypass password -dname "CN=TeleDrive, OU=Dev, O=TeleDrive, L=City, ST=State, C=US" -keyalg RSA -keysize 2048 -validity 10000
          ./gradlew :app:assembleRelease -Pandroid.injected.signing.store.file=$GITHUB_WORKSPACE/release.keystore -Pandroid.injected.signing.store.password=password -Pandroid.injected.signing.key.alias=teledrive -Pandroid.injected.signing.key.password=password --no-daemon

      - name: Upload built APKs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-apks
          path: app/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          release_name: ${{ github.ref_name }}
          body: "Automated release for ${{ github.ref_name }}"
          draft: false
          prerelease: false

      - name: Upload APKs to Release
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: app/build/outputs/apk/release/TeleDrive-${{ github.ref_name }}-universal-release.apk
          asset_name: TeleDrive-${{ github.ref_name }}-universal-release.apk
          asset_content_type: application/vnd.android.package-archive

      - name: Upload other APKs to Release
        if: always()
        run: |
          set -e
          for f in app/build/outputs/apk/release/*.apk; do
            # skip universal already uploaded
            if [[ "$f" == *"universal-release.apk" ]]; then continue; fi
            echo "Uploading $f"
            gh release upload "${{ github.ref_name }}" "$f" --repo ${{ github.repository }} || true
          done
