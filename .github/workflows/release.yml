name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  android:
    name: Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Setup keystore
        run: |
          if [ -n "${{ secrets.KEYSTORE }}" ]; then
            echo "${{ secrets.KEYSTORE }}" | base64 -d > "$RUNNER_TEMP/keystore.jks"
            echo "KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            keytool -genkeypair -v \
              -keystore "$RUNNER_TEMP/keystore.jks" \
              -alias ruslik31 \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass teledrive -keypass teledrive \
              -dname "CN=Ruslik31, OU=TeleDrive, O=TeleDrive, L=City, ST=State, C=US"
            echo "KEYSTORE_PASSWORD=teledrive" >> $GITHUB_ENV
            echo "KEY_ALIAS=ruslik31" >> $GITHUB_ENV
            echo "KEY_PASSWORD=teledrive" >> $GITHUB_ENV
          fi
          echo "KEYSTORE_FILE=$RUNNER_TEMP/keystore.jks" >> $GITHUB_ENV

      - name: Assemble signed release APKs
        run: ./gradlew :android:assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: android/build/outputs/apk/release/*.apk
          if-no-files-found: error

  windows:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Package installer
        run: ./gradlew :desktop:packageMsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: desktop/build/compose/binaries/main/msi/*.msi
          if-no-files-found: error

  publish:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [android, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          draft: true
          files: |
            artifacts/*.apk
            artifacts/*.msi
